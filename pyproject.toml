[project]
name = "crypto-dca"
version = "0.1.0"
description = "Automated Binance Spot DCA bot for scheduled limit buy orders"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.31.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pyjwt[crypto]>=2.10.1",
    # cryptography 49+ ships no x86_64 macOS wheel, and building it from source needs a
    # newer cargo than this Intel runner has. 48.x is the last with a usable wheel.
    "cryptography>=44,<49",
]

[project.scripts]
crypto-dca = "src.main:main"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "ruff==0.16.8",
]
test = [
    "pytest>=8.0.0",
    "testcontainers[postgres]>=4.0.0",
]
