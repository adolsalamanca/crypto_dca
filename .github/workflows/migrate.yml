name: Run Database Migrations

on:
  # Allow manual trigger
  workflow_dispatch:

jobs:
  migrate:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install migrate tool
        env:
          MIGRATE_VERSION: v4.18.1
          # sha256 of migrate.linux-amd64.tar.gz for MIGRATE_VERSION. Update both together.
          MIGRATE_SHA256: 2a08137b4720aa457bc760540723e313783f1fab27473463bdcc5fc2e9252959
        run: |
          if ! command -v migrate &> /dev/null; then
            echo "Installing golang-migrate..."
            curl -fsSL -o migrate.tar.gz \
              "https://github.com/golang-migrate/migrate/releases/download/${MIGRATE_VERSION}/migrate.linux-amd64.tar.gz"
            echo "${MIGRATE_SHA256}  migrate.tar.gz" | sha256sum --check --strict
            tar xzf migrate.tar.gz migrate
            rm migrate.tar.gz
            sudo mv migrate /usr/local/bin/migrate
            sudo chmod +x /usr/local/bin/migrate
          fi
          migrate -version

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Error: DATABASE_URL secret is not set"
            exit 1
          fi

          echo "Running all pending migrations..."
          migrate -path migrations -database "$DATABASE_URL" up

      - name: Show migration status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Current migration version:"
          migrate -path migrations -database "$DATABASE_URL" version
