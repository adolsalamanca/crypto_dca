name: Run Database Migrations

on:
  # Allow manual trigger
  workflow_dispatch:

jobs:
  migrate:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools (mise)
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          # sha256 of the linux-x64 mise binary for this version. Update both together.
          sha256: 5d362ecc578dc7c146679b841dda949d6472cbf86ff5635db7afdca1b6b3fd87
          # No shared cache: every run installs from mise.lock and verifies checksums.
          cache: false
        env:
          # Install exactly what mise.lock records, or fail.
          MISE_LOCKED: "1"

      - name: Show migrate version
        run: migrate -version

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Error: DATABASE_URL secret is not set"
            exit 1
          fi

          echo "Running all pending migrations..."
          migrate -path migrations -database "$DATABASE_URL" up

      - name: Show migration status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "Current migration version:"
          migrate -path migrations -database "$DATABASE_URL" version
