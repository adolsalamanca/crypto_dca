name: Daily run

on:
  schedule:
    # Run every day at 08:00 UTC
    # This corresponds to 09:00 Europe/Madrid in winter (CET = UTC+1)
    # In summer (CEST = UTC+2), this runs at 10:00 Madrid time
    - cron: '0 8 * * *'

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual order)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  buy:
    runs-on: self-hosted
    timeout-minutes: 45
    strategy:
      # One coin failing must not cancel the other's run.
      fail-fast: false
      # A single self-hosted runner, and serialising also keeps the two runs off the
      # database at the same time.
      max-parallel: 1
      matrix:
        include:
          - symbol: BTC-EUR
            spend_secret: SPEND_EUR_BTC
          - symbol: ETH-EUR
            spend_secret: SPEND_EUR_ETH
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run DCA Bot
        env:
          COINBASE_API_KEY: ${{ secrets.COINBASE_API_KEY }}
          COINBASE_API_SECRET: ${{ secrets.COINBASE_API_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USER_ID: ${{ secrets.USER_ID }}
          # Unset unless overriding the venue's default endpoint.
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          uv run python -m src.main \
            --exchange "${{ vars.EXCHANGE || 'coinbase' }}" \
            --symbol "${{ matrix.symbol }}" \
            --spend-eur "${{ secrets[matrix.spend_secret] || '50' }}" \
            --price-multiplier "${{ vars.PRICE_MULTIPLIER || '0.999' }}" \
            --time-in-force "${{ vars.TIME_IN_FORCE || 'GTC' }}" \
            --log-level "${{ vars.LOG_LEVEL || 'INFO' }}" \
            ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
