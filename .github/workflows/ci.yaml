name: CI

on:
  push:

# CI needs no secrets. It runs on a GitHub-hosted runner so that code on
# unreviewed branches, such as dependency updates, never runs on the self-hosted runner.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools (mise)
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: 2026.10.25
          # Without a sha256 input, the action verifies the binary against
          # mise's minisign-signed checksums. Renovate bumps this version.
          # No shared cache: every run installs from mise.lock and verifies checksums.
          cache: false
        env:
          # Install exactly what mise.lock records, or fail.
          MISE_LOCKED: "1"

      - name: Install dependencies
        run: uv sync --group test

      - name: Run tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check && uv run pyright
