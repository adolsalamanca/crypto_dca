name: Renovate

on:
  schedule:
    # Every Monday at 05:17 UTC.
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log level
        type: choice
        default: info
        options: [info, debug]

# The built-in GITHUB_TOKEN gets no permissions. Renovate uses a GitHub App token instead.
permissions: {}

concurrency:
  group: renovate

jobs:
  renovate:
    # GitHub-hosted and ephemeral: Renovate runs lock commands, so it never runs on the
    # self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The App private key is an environment secret. Only runs on main can read it.
    environment: renovate

    steps:
      - name: Create a 1-hour App token for this repository
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          # Renovate posts its renovate/stability-days status and reads CI results.
          permission-statuses: write
          permission-checks: read
          permission-vulnerability-alerts: read

      - name: Run Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-image: ghcr.io/renovatebot/renovate:44.198.3@sha256:bf344aa39d5b592ec728e1db5c3e1d940a5093a89a4598073efcb18d592d121c
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
